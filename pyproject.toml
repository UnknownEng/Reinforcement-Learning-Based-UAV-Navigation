[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uav_autonomy_rl"
version = "0.1.0"
description = "Autonomous UAV Flight Reinforcement Learning Environment"
authors = [{ name = "Mansoor Ahmed" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_env*"]
